services:
  mysql:
    image: mysql:8.0
    container_name: devella-mysql
    environment:
      MYSQL_DATABASE: devella
      MYSQL_USER: devella_user
      MYSQL_PASSWORD: devella_pw
      MYSQL_ROOT_PASSWORD: root_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: